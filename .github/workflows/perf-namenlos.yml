name: Namenlos Perf Experiments

on:
  pull_request:
  workflow_dispatch:

jobs:
  exp:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: f-count-same-gateway
            a_count: 1
            a_gw: 0
            b_count: 3
            b_gw: 0
          - name: g-gateway-spread
            a_count: 3
            a_gw: 0
            b_count: 3
            b_gw: -1
          - name: h-katzenpost-build
            a_count: 1
            a_gw: 0
            b_count: 1
            b_gw: 0
            b_ref: 214161aa511a01c1c8d43247cf1dea2472fc2ebc
          - name: i-arq-slop
            a_count: 1
            a_gw: 0
            b_count: 1
            b_gw: 0
            b_patch: 's/RoundTripTimeSlop = (20 \* time.Second)/RoundTripTimeSlop = (5 * time.Second)/'
          - name: j-retry-gaps
            a_count: 1
            a_gw: 0
            b_count: 1
            b_gw: 0
            b_env: KQT_RETRY_GAP_SCALE=0
          - name: k-three-vs-six
            a_count: 3
            a_gw: -1
            b_count: 6
            b_gw: -1

    steps:
      - uses: actions/checkout@v7
        with:
          path: katzenqt
      - uses: actions/checkout@v7
        with:
          repository: katzenpost/katzenpost
          ref: 730d6cf458216cc1378fbafcf0e9f28c99ec83d5
          path: katzenqt/katzenpost
      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.26'
          cache: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: latest
      - run: uv python install 3.12

      - name: Build binaries and install deps
        working-directory: katzenqt
        run: |
          set -euo pipefail
          (
            cd katzenpost
            go build -buildvcs=false -o "$GITHUB_WORKSPACE/kp-a" ./cmd/kpclientd
            if [ -n "${{ matrix.b_ref }}" ]; then
              git fetch --depth 1 origin ${{ matrix.b_ref }}
              git checkout -q FETCH_HEAD
            fi
            if [ -n "${{ matrix.b_patch }}" ]; then
              sed -i '${{ matrix.b_patch }}' client/arq.go
              grep -q 'RoundTripTimeSlop = (5 \* time.Second)' client/arq.go
            fi
            if [ -n "${{ matrix.b_ref }}${{ matrix.b_patch }}" ]; then
              go build -buildvcs=false -o "$GITHUB_WORKSPACE/kp-b" ./cmd/kpclientd
            else
              cp "$GITHUB_WORKSPACE/kp-a" "$GITHUB_WORKSPACE/kp-b"
            fi
          ) &
          build=$!
          sudo apt-get update
          sudo apt-get install -y libasound2-dev cargo
          uv sync --all-extras --dev --locked
          wait "$build"

      - name: Start arms
        id: connect
        continue-on-error: true
        working-directory: katzenqt
        run: |
          set -euo pipefail
          gwa=""; if [ "${{ matrix.a_gw }}" -ge 0 ]; then gwa="--gateway-index ${{ matrix.a_gw }}"; fi
          gwb=""; if [ "${{ matrix.b_gw }}" -ge 0 ]; then gwb="--gateway-index ${{ matrix.b_gw }}"; fi
          python3 tools/perf/kpclientd_set.py start --config config/client.toml \
            --binary "$GITHUB_WORKSPACE/kp-a" --count ${{ matrix.a_count }} \
            --base-port 64331 $gwa --out-dir "$GITHUB_WORKSPACE/arm-a"
          python3 tools/perf/kpclientd_set.py start --config config/client.toml \
            --binary "$GITHUB_WORKSPACE/kp-b" --count ${{ matrix.b_count }} \
            --base-port 64431 $gwb --out-dir "$GITHUB_WORKSPACE/arm-b"

      - name: Join a pair
        id: join
        if: steps.connect.outcome == 'success'
        continue-on-error: true
        working-directory: katzenqt
        run: |
          set -euo pipefail
          mkdir -p results/bench
          B="$PWD/results/bench"
          run() { KQT_STATE="$1" .venv/bin/python -m katzenqt.integration_runner "${@:2}" \
            --address 127.0.0.1:64331 --network tcp; }
          run "$B/alice" create-conv demo alice
          run "$B/bob" create-conv demo bob
          run "$B/bob" voucher-mint demo bob 2> "$B/mint.err"
          V=$(grep -hoE 'VOUCHER=[A-Za-z0-9+/=]+' "$B/mint.err" | head -1 | cut -d= -f2-)
          test -n "$V"
          run "$B/alice" voucher-induct demo bob "$V"
          run "$B/bob" voucher-await demo

      - name: Experiment ${{ matrix.name }}
        id: bench
        if: steps.join.outcome == 'success'
        continue-on-error: true
        working-directory: katzenqt
        run: |
          set -euo pipefail
          A=$(python3 -c "print(','.join(f'127.0.0.1:{64331+i}' for i in range(${{ matrix.a_count }})))")
          Bs=$(python3 -c "print(','.join(f'127.0.0.1:{64431+i}' for i in range(${{ matrix.b_count }})))")
          benv=""; if [ -n "${{ matrix.b_env }}" ]; then benv="--b-env ${{ matrix.b_env }}"; fi
          .venv/bin/python tools/perf/rtt_bench.py \
            --alice-state "$PWD/results/bench/alice" \
            --bob-state "$PWD/results/bench/bob" \
            --a "$A" --b "$Bs" $benv \
            --pairs 8 --block 2 --repo . --python .venv/bin/python \
            --json results/rtt_bench.json

      - name: Guard
        if: always()
        run: |
          echo "connect=${{ steps.connect.outcome }} join=${{ steps.join.outcome }} bench=${{ steps.bench.outcome }}"
          test "${{ steps.bench.outcome }}" = "success"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.name }}-${{ github.run_id }}
          path: |
            katzenqt/results/rtt_bench.json
            arm-a/manifest.json
            arm-b/manifest.json
          if-no-files-found: ignore

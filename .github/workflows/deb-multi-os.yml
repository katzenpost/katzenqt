name: Debian packages (Debian 13 + Ubuntu 26.04)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:13", "ubuntu:26.04"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install build tools
        run: |
          apt update
          apt install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all pybuild-plugin-pyproject flit \
            dpkg-dev golang-go git ca-certificates systemd pkg-config cmake \
            python3-dev python3-venv python3-pip cargo rustc unzip

      - name: Build the from-source Python closure (.debs)
        run: packaging/container/pydeps-build.sh /tmp/debs

      - name: Build the kpclientd .deb
        run: packaging/container/kpclientd-build.sh /tmp/debs

      - name: Build the katzenqt .deb
        run: |
          dpkg-buildpackage -b -uc -us
          mv ../katzenqt_*.deb /tmp/debs/

      - name: Install the whole stack with apt (no pip)
        run: |
          apt install -y \
            /tmp/debs/python3-pprintpp_*.deb \
            /tmp/debs/python3-pycrdt_*.deb \
            /tmp/debs/python3-katzenpost-thinclient_*.deb \
            /tmp/debs/kpclientd_0.0.1_*.deb \
            /tmp/debs/katzenqt_0.0.1_all.deb

      - name: Smoke test and assert the service is installed but not enabled
        run: |
          set -eu
          katzenqt-headless --help >/dev/null
          python3 -c "import pycrdt, katzenpost_thinclient"
          test -x /usr/bin/kpclientd
          test -f /etc/kpclientd/client.toml
          test -f /usr/lib/systemd/user/kpclientd.service
          if find /etc/systemd/user /usr/lib/systemd/user /root/.config/systemd/user \
               -path '*.wants/kpclientd.service' 2>/dev/null | grep -q .; then
            echo "error: kpclientd.service is enabled; it must be opt-in per user" >&2
            exit 1
          fi

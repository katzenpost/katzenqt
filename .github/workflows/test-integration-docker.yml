name: Docker Mixnet Integration Tests

# End-to-end test that stands up a Katzenpost docker mixnet and runs the
# opt-in Alice + Bob integration test in tests/integration/. Mirrors the
# structure of thin_client's test-integration-docker.yml workflow.
#
# The `ref:` on the katzenpost checkout below is the single pin that
# controls which kpclientd version is built. Keep it aligned with the
# pin in thin_client's own test-integration-docker.yml workflow so all
# three repos (katzenpost, thin_client, katzenqt) exercise the same
# daemon on every CI run.

on:
  pull_request:
    branches: [main, master, resending_api2026_fix_decryption_bugs]
  push:
    branches: [main, master, resending_api2026_fix_decryption_bugs]

jobs:
  docker-integration:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    # Bounds the whole job, including both the parallel and serial pytest
    # steps below combined -- each of those also carries its own
    # timeout-minutes: 90 label, but that is not an independent budget on
    # top of this one; whichever limit is hit first ends the job.
    timeout-minutes: 90

    steps:
      - name: Checkout katzenqt
        uses: actions/checkout@v4
        with:
          path: katzenqt

      # Checked out under katzenqt/ so katzenqt's Makefile default
      # KATZENPOST_DIR (="katzenpost", relative to the Makefile) resolves
      # without modification. Pin to a sha that has every daemon API the
      # integration test exercises — see top-of-file note.
      - name: Checkout katzenpost
        uses: actions/checkout@v4
        with:
          repository: katzenpost/katzenpost
          # Keep in lockstep with
          # thin_client/.github/workflows/test-integration-docker.yml —
          # both katzenqt and thin_client must exercise the same
          # kpclientd sha or protocol drift will hit one workflow
          # before the other.
          ref: 214161aa511a01c1c8d43247cf1dea2472fc2ebc # tip of main as of 2026-09-08
          path: katzenqt/katzenpost

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Configure podman socket
        run: systemctl --user start podman.socket || true

      - name: Set up Go (for kpclientd build)
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.26'
          cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin || true

      # Build kpclientd + start the mixnet via katzenpost's own docker
      # Makefile. `make wait` blocks until the dirauths reach consensus.
      - name: Build and start the docker mixnet
        working-directory: katzenqt/katzenpost/docker
        run: make base_port=62331 start wait

      - name: Brief pause so the mixnet is fully ready
        run: sleep 30

      # Create the venv and install katzenqt in editable mode — matches
      # what `make docker-integration` does locally, minus the Makefile's
      # apt/pipx bootstrap which the GitHub runner doesn't need.
      - name: Install katzenqt + dev deps
        working-directory: katzenqt
        run: uv sync --all-extras --dev --locked

      - name: Run integration tests
        working-directory: katzenqt
        # CI runs roughly 2.5-3x slower than a local docker mixnet, and
        # the multi-box reassembly tests are the slowest, dominating the
        # wall clock at around eight minutes apiece. A serial run with 14
        # integration tests measured 49m for this step alone.
        #
        # Two phases:
        #  1. everything EXCEPT the container-bouncing watchdog tests runs
        #     in parallel via pytest-xdist loadscope (each worker gets its
        #     own process stack; the only shared resource is kpclientd,
        #     which the parallel set only talks to, never bounces);
        #  2. the @pytest.mark.serial_docker tests run afterwards, serially,
        #     because they stop/pause the shared kpclientd/gateway
        #     containers and must not race the parallel workers.
        # 4 workers with a raised send budget floor: the send-side
        # wall-clock budget in katzenqt's _send_one_gcm (floor raised from
        # 120s to 240s via KQT_SEND_BUDGET_FLOOR_S) now absorbs the
        # ~2.5-3x CI slowdown plus 4-way concurrent load on the single
        # shared kpclientd, which previously caused send timeouts on the
        # 4-vCPU runner. Drop this only if the runner class changes.
        timeout-minutes: 90
        env:
          KATZENQT_DOCKER_INTEGRATION: "1"
          KQT_INTEGRATION_PARALLEL: "4"
          KQT_SEND_BUDGET_FLOOR_S: "240"
        run: |
          .venv/bin/pytest tests/integration -vv -n "${KQT_INTEGRATION_PARALLEL}" \
            --dist loadscope -m "not serial_docker"

      - name: Run serial watchdog integration tests
        working-directory: katzenqt
        # Always run the @pytest.mark.serial_docker watchdog tests even when
        # the parallel phase above fails, so the state of the shared
        # kpclientd/gateway containers is still probed on every CI run.
        if: always()
        timeout-minutes: 90
        env:
          KATZENQT_DOCKER_INTEGRATION: "1"
        run: |
          .venv/bin/pytest tests/integration -vv -m serial_docker

      - name: Stop the mixnet
        if: always()
        working-directory: katzenqt/katzenpost/docker
        run: make stop

      - name: Upload mixnet logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixnet-${{ github.run_id }}-${{ github.job }}
          path: |
            katzenqt/katzenpost/docker/mixnet-alpine/*/*.log
            katzenqt/katzenpost/docker/mixnet-alpine/*/*/*.log

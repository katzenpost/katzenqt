name: pytest (uv)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (uv)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.26'
          cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          make deps
          uv sync --all-extras --dev --locked

      - name: Verify the rust audio extension built
        run: uv run python -c "import rustic_audio_tool as r; assert hasattr(r, 'PttAudioEngine')"

      - name: Run tests
        run: |
          uv run pytest

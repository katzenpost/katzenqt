name: pytest (uv)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (uv)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: '>=1.26'
          cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: 0.11.14

      - name: Set up Python
        run: uv python install 3.12

      - name: Select the Rust toolchain
        run: timeout --kill-after=10s 300s bash tools/ci-rust.sh

      - name: Install dependencies
        run: |
          bash tools/ci-deps.sh

      - name: Verify the rust audio extension built
        run: uv run python -c "import rustic_audio_tool as r; assert hasattr(r, 'PttAudioEngine')"

      - name: Run tests
        run: |
          uv run pytest

name: pytest (uv)

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (uv)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '>=1.26'
          cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.11.14

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          make deps
          uv sync --all-extras --dev --locked

      - name: Verify the rust audio extension built
        run: uv run python -c "import rustic_audio_tool as r; assert hasattr(r, 'PttAudioEngine')"

      - name: Run tests
        run: |
          uv run pytest

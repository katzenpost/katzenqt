name: nightly cases on change

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  on-change:
    name: nightly cases on change
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Select the Rust toolchain
        run: timeout --kill-after=10s 300s bash tools/ci-rust.sh

      - name: Install dependencies
        run: bash tools/ci-deps.sh

      - name: Run the nightly cases when their subject changed
        run: |
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "no git history to compare; running the nightly cases"
            make test-nightly-uv
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base=$(git rev-parse HEAD~1 2>/dev/null || echo HEAD); fi
          if git diff --name-only "$base" HEAD | grep -qE '^(src/katzenqt/voucher\.py|tests/test_voucher_state_machine\.py)$'; then
            make test-nightly-uv
          else
            echo "no change under the nightly cases; skipped"
          fi

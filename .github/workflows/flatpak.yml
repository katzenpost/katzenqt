name: Flatpak

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install podman and flatpak
        run: make flatpak-system-deps

      - name: Build the flatpak in podman
        run: make flatpak-build

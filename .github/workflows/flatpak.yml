name: Flatpak

on:
  push:
    paths:
      - 'packaging/flatpak/**'
      - 'packaging/network.katzenpost.katzenqt.desktop'
      - '.github/workflows/flatpak.yml'
  pull_request:
    paths:
      - 'packaging/flatpak/**'
      - 'packaging/network.katzenpost.katzenqt.desktop'
      - '.github/workflows/flatpak.yml'

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: make flatpak-system-deps
      - run: make flatpak-build

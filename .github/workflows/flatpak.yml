name: Flatpak

on:
  push:
    branches: ['**']
    paths:
      - 'packaging/flatpak/**'
      - 'packaging/network.katzenpost.katzenqt.desktop'
      - '.github/workflows/flatpak.yml'
  pull_request:
    paths:
      - 'packaging/flatpak/**'
      - 'packaging/network.katzenpost.katzenqt.desktop'
      - '.github/workflows/flatpak.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: make flatpak-system-deps
      - run: make flatpak-build
      - name: Bundle the Flatpak for the release
        if: github.ref_type == 'tag'
        run: |
          mkdir release
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            .flatpak-repo \
            "release/network.katzenpost.katzenqt_${GITHUB_REF_NAME}.flatpak" \
            network.katzenpost.katzenqt master
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: flatpak
          path: release/*
          if-no-files-found: error

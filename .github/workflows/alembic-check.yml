name: alembic (uv)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: alembic (uv)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: 0.11.14

      - name: Set up Python
        run: uv python install 3.12

      - name: Select the Rust toolchain
        run: timeout --kill-after=10s 300s bash tools/ci-rust.sh

      - name: Install dependencies
        run: |
          bash tools/ci-deps.sh

      - name: Run alembic check
        run: make alembic-check-uv
